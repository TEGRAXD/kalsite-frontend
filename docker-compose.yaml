services:
  web:
    container_name: kalsite-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SYSTEM_NAME: ${NEXT_PUBLIC_SYSTEM_NAME:-ZOOT}
    env_file:
      - .env
    command: ["bun", "run", "start"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - cloudflared_tunnel

networks:
  cloudflared_tunnel:
    external: true
